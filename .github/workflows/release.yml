name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build Mod JAR
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/libs/*.jar --clobber
            gh release edit "$TAG" --title "Lucky 7 $TAG (Minecraft 26.3 Fabric)" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" build/libs/*.jar --title "Lucky 7 $TAG (Minecraft 26.3 Fabric)" --notes-file RELEASE_NOTES.md
          fi
      - name: Publish to CurseForge
        if: ${{ secrets.CURSEFORGE_TOKEN != '' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew publishCurseforge
