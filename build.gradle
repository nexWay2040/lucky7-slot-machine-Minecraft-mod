plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base { archivesName = 'lucky7' }

group = project.group
version = project.version

repositories { }

loom { splitEnvironmentSourceSets(); mods { lucky7 { sourceSet sourceSets.main; sourceSet sourceSets.client } } }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

jar { from('LICENSE') { rename { "${it}_lucky7" } } }
