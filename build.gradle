plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

base { archivesName = 'lucky7' }

group = project.group
version = project.version

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lucky7" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

publishMods {
	file = jar.archiveFile
	changelog = file("RELEASE_NOTES.md").text
	type = STABLE
	modLoaders.add("fabric")
	displayName = "Lucky 7 ${project.version} (MC ${project.minecraft_version})"
	dryRun = providers.environmentVariable("CURSEFORGE_TOKEN").map { it.trim().isEmpty() }.getOrElse(true)

	curseforge {
		accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse("")
		projectId = "1783404"
		minecraftVersions.add("${project.minecraft_version}")
		javaVersions.add(JavaVersion.VERSION_25)
		clientRequired = true
		serverRequired = true
		requires("fabric-api")
	}
}
